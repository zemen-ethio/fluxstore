<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxstore AI — Intelligent Cloud Infrastructure</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #080b10;
    --bg-1: #0d1117;
    --bg-2: #141b24;
    --bg-3: #1c2535;
    --bg-4: #243044;
    --border: rgba(99,160,255,0.12);
    --border-bright: rgba(99,160,255,0.28);
    --accent: #3d8bff;
    --accent-2: #00e5c0;
    --accent-3: #ff6b35;
    --accent-4: #c77dff;
    --text-1: #e8edf5;
    --text-2: #8fa3be;
    --text-3: #4f657f;
    --success: #00c896;
    --warning: #ffb347;
    --danger: #ff4d6d;
    --mono: 'Space Mono', monospace;
    --display: 'Syne', sans-serif;
    --body: 'DM Sans', sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 4px 32px rgba(0,0,0,0.5);
    --glow: 0 0 40px rgba(61,139,255,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--body);
    background: var(--bg-0);
    color: var(--text-1);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ── NOISE TEXTURE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--bg-1);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    padding: 0;
    z-index: 100;
  }

  .sidebar-logo {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 20px rgba(61,139,255,0.35);
    flex-shrink: 0;
  }
  .logo-text { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  .logo-text span { color: var(--accent); }
  .logo-sub { font-family: var(--mono); font-size: 9px; color: var(--text-3); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

  .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius);
    cursor: pointer; transition: all 0.18s ease;
    color: var(--text-2); font-size: 13.5px; font-weight: 400;
    border: 1px solid transparent;
    margin-bottom: 2px;
    position: relative;
  }
  .nav-item:hover { background: var(--bg-3); color: var(--text-1); }
  .nav-item.active {
    background: rgba(61,139,255,0.12);
    color: var(--accent);
    border-color: rgba(61,139,255,0.2);
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <div class="logo-icon">⚡</div>
        <div>
          <div class="logo-text">Flux<span>store</span> AI</div>
          <div class="logo-sub">v2.4.1 · stable</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item active">Dashboard</div>
        <div class="nav-item">File Manager</div>
        <div class="nav-item">Settings</div>
    </nav>
</div>
</body>
</html>
